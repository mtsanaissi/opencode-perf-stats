name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Check lockfile is current
        run: uv lock --check

      - name: Install project and test deps
        run: uv sync --extra web

      - name: Run tests
        run: uv run pytest tests/ -q
